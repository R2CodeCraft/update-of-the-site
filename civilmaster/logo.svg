<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Blue to purple gradient for the triangle -->
    <linearGradient id="triangleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Circular blue border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#2563EB" stroke-width="16" filter="url(#shadow)"/>
  
  <!-- Stylized triangle with gradient -->
  <polygon points="256,120 340,280 172,280" fill="url(#triangleGradient)" filter="url(#shadow)"/>
  
  <!-- AGHA text -->
  <text x="256" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="48" fill="#2563EB" letter-spacing="4">AGHA</text>
  
  <!-- Civil Master text -->
  <text x="256" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="28" fill="#2563EB" letter-spacing="2">CIVIL MASTER</text>
</svg>
