  <rect x="30" y="190" width="65" height="80" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="105" y="190" width="65" height="80" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="30" y="280" width="140" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="30" y="310" width="100" height="20" rx="4" fill="rgba(255,255,255,0.1)"/>
